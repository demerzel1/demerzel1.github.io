<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.data.profile.name }} — Machine Learning & Robotics</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | escape }} · {{ site.data.profile.name }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/images/monogram.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/profile.js' | relative_url }}" defer></script>
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":{{ site.data.profile.name | jsonify }},"url":{{ '/' | absolute_url | jsonify }},"jobTitle":{{ site.data.profile.role | jsonify }},"affiliation":[{"@type":"Organization","name":"Einride"},{"@type":"CollegeOrUniversity","name":"Chalmers University of Technology"},{"@type":"CollegeOrUniversity","name":"University of Gothenburg"}],"sameAs":[{% for link in site.data.profile.links %}{{ link.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
  </head>
  <body class="{% if page.url == '/' %}home{% else %}inner-page{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Zhaoxin Meng, home">Zhaoxin Meng</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.url == '/cv/' %}aria-current="page"{% endif %}>CV</a>
      </nav>
    </header>
    <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
    <footer class="site-footer wrap">
      <p>© {{ site.time | date: '%Y' }} Zhaoxin Meng</p>
      <a href="mailto:{{ site.data.profile.email }}">{{ site.data.profile.email }}</a>
    </footer>
  </body>
</html>
